<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

Body { background-color: rgb(242, 230, 139);
}

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.gallery {
  display: flex;
  flex-wrap: flex-wrap;
  flex-direction: column; 
  align-items: center;
  justify-content: center;
  padding:0 15px
}

.gallery-item {
   position: relative;
   width: 35%;
   height: auto;
   margin: 10px;
   opacity: 0.5;
   cursor: pointer;
   transition: transform 0.5s ease;
}

.gallery-item:hover {
  transform:scale(1.1);
  opacity: 1.0;
}

/* The Modal (background) */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.8);
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease-out, visibility 0.3s ease-out
}

/* Modal content (image) */
.modal-content {
  position: relative;
  width: 60%;
  height: auto;
  max-width: 60%
  max-height: auto%
  border-radius: 5px;
  overflow: hidden;
  justify-content: center;
}


.modal.show {
  display: flex;
  opacity: 1;
  visibility: visible;
}

/* Close button */
.close {
  position: absolute;
  top: 10px;
  right: 15px;
  color: #ffffff;
  font-size: 35px;
  font-weight: bold;
  cursor: pointer;
}

.modal.hide{
    opacity: 0;
    visibility: hidden;
}

@media screen and (max width: 768px) {
  .gallery-item {
    width: calc(50% - 20px);
  }
}

@media screen and (max-width: 480px) {
  .gallery-item {
    width: calc(100% - 20px);
  }
}
</style>
</head>
<body>

<div class="gallery">
  <img src="balloon.jpg" alt="Geiru" class="gallery-item"
onclick="openModal('modal1')">
  <img src="necklace.jpg" alt="Wyatt" class="gallery-item"
onclick="openModal('modal2')">
</div>

<div id="modal1" class="modal">
  <span class="close" onclick="closeModal('modal1')">&times;</span>
  <img src="balloon.jpg" alt="Geiru" class="modal-content">
</div>

<div id="modal2" class="modal">
  <span class="close" onclick="closeModal('modal2')">&times;</span>
  <img src="necklace.jpg" alt="Wyatt" class="modal-content">
</div>

<script>
function openModal(modalId) {
   let modal = document.getElementById(modalId);
   modal.style.display = "flex";
setTimeout(() => {
   modal.classList.add("show");
   }, 500);
}

function closeModal(modalId) {
  let modal =
document.getElementById(modalId);
  modal.classList.remove("show");
  modal.classList.add("hide");
  setTimeout(function () {
    modal.style.display = "none";
    modal.classList.remove("hide");
  }, 300);
}
</script>
